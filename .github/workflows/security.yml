name: Security Scanning

on:
  schedule:
    - cron: '0 2 * * 0'  # Run every Sunday at 2 AM UTC
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  npm-audit-frontend:
    name: NPM Audit - Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Report npm vulnerabilities
        if: steps.npm-audit.outcome == 'failure'
        run: npm audit --json > npm-audit-frontend.json

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-frontend
          path: npm-audit-frontend.json
          retention-days: 30

  npm-audit-backend:
    name: NPM Audit - Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Report npm vulnerabilities
        if: steps.npm-audit.outcome == 'failure'
        run: npm audit --json > npm-audit-backend.json

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-backend
          path: npm-audit-backend.json
          retention-days: 30

  pip-audit-ai:
    name: Pip Audit - AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip audit
        id: pip-audit
        continue-on-error: true
        run: pip-audit --requirements requirements.txt --desc

      - name: Save pip audit results
        if: steps.pip-audit.outcome == 'failure'
        run: pip-audit --requirements requirements.txt --json > pip-audit-results.json

      - name: Upload pip audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --json

  create-security-issue:
    name: Create Security Issue if Vulnerabilities Found
    runs-on: ubuntu-latest
    needs: [npm-audit-frontend, npm-audit-backend, pip-audit-ai]
    if: |
      github.event_name == 'schedule' && 
      (needs.npm-audit-frontend.result == 'failure' || 
       needs.npm-audit-backend.result == 'failure' || 
       needs.pip-audit-ai.result == 'failure')
    steps:
      - uses: actions/checkout@v4

      - name: Download all audit results
        uses: actions/download-artifact@v4
        with:
          path: audit-results

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let vulnerabilityReport = '## 🔒 Security Vulnerability Report\n\n';
            let foundVulnerabilities = false;
            
            // Check frontend npm audit
            const frontendAuditPath = 'audit-results/npm-audit-frontend/npm-audit-frontend.json';
            if (fs.existsSync(frontendAuditPath)) {
              try {
                const frontendAudit = JSON.parse(fs.readFileSync(frontendAuditPath, 'utf8'));
                if (frontendAudit.metadata.vulnerabilities.total > 0) {
                  foundVulnerabilities = true;
                  vulnerabilityReport += `### Frontend NPM Audit\n`;
                  vulnerabilityReport += `- **Total vulnerabilities**: ${frontendAudit.metadata.vulnerabilities.total}\n`;
                  vulnerabilityReport += `- **Critical**: ${frontendAudit.metadata.vulnerabilities.critical}\n`;
                  vulnerabilityReport += `- **High**: ${frontendAudit.metadata.vulnerabilities.high}\n`;
                  vulnerabilityReport += `- **Moderate**: ${frontendAudit.metadata.vulnerabilities.moderate}\n\n`;
                }
              } catch (e) {
                console.log('Error reading frontend audit:', e);
              }
            }
            
            // Check backend npm audit
            const backendAuditPath = 'audit-results/npm-audit-backend/npm-audit-backend.json';
            if (fs.existsSync(backendAuditPath)) {
              try {
                const backendAudit = JSON.parse(fs.readFileSync(backendAuditPath, 'utf8'));
                if (backendAudit.metadata.vulnerabilities.total > 0) {
                  foundVulnerabilities = true;
                  vulnerabilityReport += `### Backend NPM Audit\n`;
                  vulnerabilityReport += `- **Total vulnerabilities**: ${backendAudit.metadata.vulnerabilities.total}\n`;
                  vulnerabilityReport += `- **Critical**: ${backendAudit.metadata.vulnerabilities.critical}\n`;
                  vulnerabilityReport += `- **High**: ${backendAudit.metadata.vulnerabilities.high}\n`;
                  vulnerabilityReport += `- **Moderate**: ${backendAudit.metadata.vulnerabilities.moderate}\n\n`;
                }
              } catch (e) {
                console.log('Error reading backend audit:', e);
              }
            }
            
            // Check pip audit
            const pipAuditPath = 'audit-results/pip-audit-results/pip-audit-results.json';
            if (fs.existsSync(pipAuditPath)) {
              try {
                const pipAudit = JSON.parse(fs.readFileSync(pipAuditPath, 'utf8'));
                if (pipAudit.vulnerabilities && pipAudit.vulnerabilities.length > 0) {
                  foundVulnerabilities = true;
                  vulnerabilityReport += `### AI Service Pip Audit\n`;
                  vulnerabilityReport += `- **Total vulnerabilities**: ${pipAudit.vulnerabilities.length}\n\n`;
                }
              } catch (e) {
                console.log('Error reading pip audit:', e);
              }
            }
            
            if (foundVulnerabilities) {
              vulnerabilityReport += `\n**Action Required**: Please review and update dependencies to resolve security vulnerabilities.\n`;
              vulnerabilityReport += `\n📋 [View Full Audit Results](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
              
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Security Vulnerabilities Detected',
                body: vulnerabilityReport,
                labels: ['security', 'dependencies', 'auto-generated']
              });
            }

  dependency-update-check:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check frontend outdated packages
        continue-on-error: true
        run: npm outdated

      - name: Check backend outdated packages
        continue-on-error: true
        working-directory: backend
        run: npm outdated

      - name: Check AI service outdated packages
        continue-on-error: true
        working-directory: ai-service
        run: pip list --outdated

      - name: Create dependabot-style PR
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📦 Dependency Update Check - Review available updates',
              body: 'Weekly dependency update check. Review the workflow run for details on available updates.',
              labels: ['dependencies', 'maintenance']
            });
